const sections=[{"title": "I. LISTENING", "passageTitle": "🎧 LISTENING TRANSCRIPT (bản chép lời)", "passage": "Conversation 1:\nSpeaker 1: Hey, Jane. Are you free? Let's go shopping.\nJane: Sorry, I have to do some chores.\nSpeaker 1: Ohh. Can you ask your brother, James to do them?\nJane: He never helps me. He cleans his room like once a month.\nSpeaker 1: Really? I'd never know that looking at him.\nJane: He likes to dress nicely but his room is a mess. Anyway, how about later at four?\nSpeaker 1: Okay.\n\nConversation 2:\nEmma: Matt, can you help me vacuum the floor? You always make me do the vacuuming.\nMatt: Well, then do you want to clean the kitchen and the bathroom or mop the floor?\nEmma: I'll do the vacuuming.\nMatt: That's about the only chore you do besides helping dad in the garden.\nEmma: I know. I know. I'll help you wash the dishes tonight.\nMatt: Good.\n\nConversation 3:\nSpeaker 1: What are you doing after school?\nSpeaker 2: I'm going to Noah's house. He bought a new game.\nSpeaker 1: What's he like?\nSpeaker 2: He's nice. He might seem a bit grumpy at first but he's actually really friendly. However, he doesn't always keep his promises. He said he'd help me do my vlogs every week but he's only helped once.\nSpeaker 1: Uh, okay.\n\nConversation 4:\nSpeaker 1: What's your mom like, Kelly?\nKelly: She's intelligent and hard working. She's busy so we help or do housework.\nSpeaker 1: What chores do you do?\nKelly: I do the laundry and dishes. Sometimes, I make dinner.\nSpeaker 1: What about your dad and your brother?\nKelly: My dad doesn't do much, just the shopping. My brother and I vacuum and mop the floor. We also help my mom clean the bathroom and kitchen.\n\nConversation 5:\nMom: Marley, have you tidied up your room?\nMarley: I'll do it now. I forgot because I was looking for clothes online.\nMom: You already have so many clothes.\nMarley: Sorry, Mom.\nMom: When you're done, help me make lunch. You're sixteen now and you can't even do housework or make a simple meal. How will you take care of yourself when you're in college?", "translation": "Cuộc trò chuyện 1:\nNgười nói 1: Này Jane, bạn rảnh không? Chúng ta đi mua sắm nhé.\nJane: Xin lỗi, tôi phải làm một số việc nhà.\nNgười nói 1: Bạn có thể nhờ anh trai James làm giúp không?\nJane: Anh ấy không bao giờ giúp tôi. Anh ấy chỉ dọn phòng khoảng mỗi tháng một lần.\nNgười nói 1: Thật sao? Nhìn anh ấy tôi không nghĩ vậy.\nJane: Anh ấy thích ăn mặc đẹp nhưng phòng thì bừa bộn. Dù sao, khoảng 4 giờ đi nhé?\nNgười nói 1: Được.\n\nCuộc trò chuyện 2:\nEmma: Matt, anh có thể giúp em hút bụi sàn nhà không? Anh luôn bắt em làm việc hút bụi.\nMatt: Vậy em muốn dọn nhà bếp và phòng tắm hay lau sàn?\nEmma: Em sẽ hút bụi.\nMatt: Đó gần như là việc nhà duy nhất em làm ngoài việc giúp bố trong vườn.\nEmma: Em biết rồi. Tối nay em sẽ giúp anh rửa bát.\nMatt: Tốt.\n\nCuộc trò chuyện 3:\nNgười nói 1: Bạn định làm gì sau giờ học?\nNgười nói 2: Tôi sẽ đến nhà Noah. Cậu ấy vừa mua một trò chơi mới.\nNgười nói 1: Cậu ấy là người thế nào?\nNgười nói 2: Cậu ấy tốt bụng. Ban đầu cậu ấy có vẻ hơi cáu kỉnh nhưng thực ra rất thân thiện. Tuy nhiên, cậu ấy không phải lúc nào cũng giữ lời hứa. Cậu ấy nói sẽ giúp tôi làm vlog mỗi tuần nhưng mới chỉ giúp một lần.\nNgười nói 1: À, được rồi.\n\nCuộc trò chuyện 4:\nNgười nói 1: Mẹ bạn là người thế nào, Kelly?\nKelly: Mẹ thông minh và chăm chỉ. Mẹ bận nên chúng tôi giúp đỡ hoặc làm việc nhà.\nNgười nói 1: Bạn làm những việc gì?\nKelly: Tôi giặt quần áo và rửa bát. Đôi khi tôi nấu bữa tối.\nNgười nói 1: Còn bố và anh trai bạn?\nKelly: Bố tôi không làm nhiều việc, chỉ đi mua sắm. Anh trai và tôi hút bụi, lau sàn. Chúng tôi cũng giúp mẹ dọn phòng tắm và nhà bếp.\n\nCuộc trò chuyện 5:\nMẹ: Marley, con đã dọn phòng chưa?\nMarley: Con sẽ làm ngay. Con quên mất vì mải tìm quần áo trên mạng.\nMẹ: Con đã có quá nhiều quần áo rồi.\nMarley: Con xin lỗi mẹ.\nMẹ: Khi xong, hãy giúp mẹ chuẩn bị bữa trưa. Con đã 16 tuổi rồi mà vẫn chưa biết làm việc nhà hay nấu một bữa ăn đơn giản. Khi học đại học, con sẽ tự chăm sóc bản thân thế nào?", "questions": [{"n": 1, "q": "You will hear a girl talking to her friend. What does she say about her brother?", "opts": ["He's very helpful.", "He's lazy.", "He does most of the chores."], "a": 1, "why": "Jane nói: “He never helps me. He cleans his room like once a month.” Điều này cho thấy anh trai cô ấy lười và ít giúp việc nhà.", "vi": "Bạn sẽ nghe một cô gái nói chuyện với bạn mình. Cô ấy nói gì về anh trai mình?"}, {"n": 2, "q": "You will hear a girl, Emma, talking to her brother about doing chores. Who often does the most chores?", "opts": ["Her dad.", "Her brother.", "Emma."], "a": 2, "why": "Matt nói việc hút bụi gần như là việc nhà duy nhất Emma làm ngoài việc giúp bố trong vườn. Theo đáp án của đề, chọn Emma.", "vi": "Bạn sẽ nghe Emma nói chuyện với anh trai về việc nhà. Ai thường làm nhiều việc nhà nhất?"}, {"n": 3, "q": "You will hear a boy talking about his friend. What does he say about Noah?", "opts": ["He's helpful.", "He's unfriendly.", "He's unreliable."], "a": 2, "why": "Noah thân thiện nhưng không phải lúc nào cũng giữ lời hứa; cậu ấy chỉ giúp làm vlog một lần dù đã hứa giúp hàng tuần. Vì vậy Noah không đáng tin cậy.", "vi": "Bạn sẽ nghe một cậu bé nói về bạn mình. Cậu ấy nói gì về Noah?"}, {"n": 4, "q": "You will hear a girl talking about her family. Who's the least helpful family member?", "opts": ["Her dad.", "Her mom.", "Her brother."], "a": 0, "why": "Kelly nói bố cô ấy không làm nhiều việc, chỉ đi mua sắm; cô ấy và anh trai làm nhiều việc nhà hơn.", "vi": "Bạn sẽ nghe một cô gái nói về gia đình mình. Ai là thành viên ít giúp đỡ nhất?"}, {"n": 5, "q": "You will hear a mom talking to her daughter. The mom wants her daughter to ______.", "opts": ["donate her clothes", "do chores and learn how to cook", "study for college"], "a": 1, "why": "Người mẹ nói con gái đã 16 tuổi nhưng vẫn chưa biết làm việc nhà hoặc nấu một bữa ăn đơn giản. Bà muốn con biết tự chăm sóc bản thân.", "vi": "Bạn sẽ nghe một người mẹ nói chuyện với con gái. Người mẹ muốn con gái làm gì?"}]}, {"title": "II. PRONUNCIATION & STRESS", "questions": [{"n": 6, "q": "Find the word which has a different sound in the part underlined.", "opts": ["clean", "easygoing", "mean", "breakfast"], "a": 3, "why": "“Breakfast” có phần “ea” phát âm /e/, trong khi “clean”, “easygoing” và “mean” có âm /iː/.", "vi": "Tìm từ có phần gạch chân được phát âm khác với các từ còn lại."}, {"n": 7, "q": "Find the word which has a different sound in the part underlined.", "opts": ["vacuum", "wash", "karaoke", "brand"], "a": 1, "why": "“Wash” có âm /ɒ/ theo cách phát âm Anh-Anh; các từ còn lại có âm /æ/ ở phần được gạch chân.", "vi": "Tìm từ có phần gạch chân được phát âm khác với các từ còn lại."}, {"n": 8, "q": "Choose the word which has a different stress pattern from the others.", "opts": ["leisure", "temple", "offer", "receipt"], "a": 3, "why": "“Receipt” có trọng âm rơi vào âm tiết thứ hai; các từ còn lại có trọng âm ở âm tiết thứ nhất.", "vi": "Chọn từ có vị trí trọng âm chính khác với các từ còn lại."}, {"n": 9, "q": "Choose the word which has a different stress pattern from the others.", "opts": ["treasure", "budget", "habit", "restart"], "a": 3, "why": "“Restart” có trọng âm chính ở âm tiết thứ hai; “treasure”, “budget” và “habit” có trọng âm ở âm tiết thứ nhất.", "vi": "Chọn từ có vị trí trọng âm chính khác với các từ còn lại."}, {"n": 10, "q": "Choose the word which has a different stress pattern from the others.", "opts": ["unreliable", "disconnect", "overheat", "aerobics"], "a": 3, "why": "Theo phần giải thích của đề, “aerobics” có trọng âm ở âm tiết thứ hai, còn các từ còn lại có trọng âm chính ở âm tiết thứ ba.", "vi": "Chọn từ có vị trí trọng âm chính khác với các từ còn lại."}]}, {"title": "III. VOCABULARY & GRAMMAR", "questions": [{"n": 11, "q": "He ______ at the sports centre twice a week.", "opts": ["usually is", "usually was", "is usually", "was usually"], "a": 2, "why": "“Twice a week” diễn tả thói quen nên dùng hiện tại đơn. Trạng từ tần suất đứng sau động từ “to be”: S + be + usually + ...", "vi": "Anh ấy thường ở trung tâm thể thao hai lần một tuần."}, {"n": 12, "q": "I ______ my bedroom at the weekend.", "opts": ["clean often", "often clean", "cleaned often", "often cleaned"], "a": 1, "why": "“At the weekend” diễn tả thói quen. Với động từ thường, trạng từ tần suất đứng trước động từ: often clean.", "vi": "Tôi thường dọn phòng ngủ vào cuối tuần."}, {"n": 13, "q": "Mr. Brown has decided ______, so we're going to have a party.", "opts": ["retire", "to be retired", "retiring", "to retire"], "a": 3, "why": "Cấu trúc: decide + to V = quyết định làm gì.", "vi": "Ông Brown đã quyết định nghỉ hưu, vì vậy chúng ta sẽ tổ chức một bữa tiệc."}, {"n": 14, "q": "He tried to deny ______ the money, but no one believed him.", "opts": ["take", "taken", "to take", "taking"], "a": 3, "why": "Cấu trúc: deny + V-ing = phủ nhận đã làm gì.", "vi": "Anh ta cố gắng phủ nhận việc lấy số tiền, nhưng không ai tin anh ta."}, {"n": 15, "q": "I really enjoyed ______ to those MP3s you sent me.", "opts": ["to listen", "listening", "listen", "listened"], "a": 1, "why": "Cấu trúc: enjoy + V-ing = thích làm gì/thích việc gì.", "vi": "Tôi thực sự thích nghe những bản MP3 bạn đã gửi cho tôi."}, {"n": 16, "q": "Tell us another joke – but a ______ one this time! That one took forever!", "opts": ["short", "shorter than", "shortest", "shorter"], "a": 3, "why": "Có sự so sánh giữa câu chuyện lần này và câu chuyện trước nên dùng tính từ so sánh hơn “shorter”. Không dùng “than” khi không có đối tượng so sánh theo sau.", "vi": "Hãy kể cho chúng tôi một câu chuyện cười khác, nhưng lần này ngắn hơn nhé! Câu chuyện kia dài lê thê!"}, {"n": 17, "q": "I didn't win the lottery. Maybe I'll be ______ next time.", "opts": ["more lucky", "luckier", "more luckily", "luckier than"], "a": 1, "why": "“Lucky” là tính từ kết thúc bằng phụ âm + y; khi chuyển sang so sánh hơn, đổi y thành i rồi thêm -er: luckier.", "vi": "Tôi đã không trúng xổ số. Có lẽ lần sau tôi sẽ may mắn hơn."}, {"n": 18, "q": "His new film is much ______ than his last one. I loved that one!", "opts": ["entertaining", "more entertain", "entertainer", "more entertaining"], "a": 3, "why": "Tính từ dài “entertaining” dùng cấu trúc so sánh hơn: more + adjective + than.", "vi": "Bộ phim mới của anh ấy giải trí hơn nhiều so với bộ phim trước."}, {"n": 19, "q": "It was very sunny last Sunday, ______ we went to the beach.", "opts": ["but", "or", "because", "so"], "a": 3, "why": "“So” diễn tả kết quả: trời nắng đẹp, vì vậy chúng tôi đi biển.", "vi": "Chủ nhật tuần trước trời rất nắng, vì vậy chúng tôi đã đi biển."}, {"n": 20, "q": "It's very ______ of him to just expect that Polly will do all the childcare.", "opts": ["selfish", "generous", "caring", "kind"], "a": 0, "why": "“Selfish” nghĩa là ích kỷ. Mong đợi Polly làm tất cả việc chăm sóc trẻ là hành động ích kỷ.", "vi": "Anh ấy thật ích kỷ khi chỉ mong Polly làm tất cả công việc chăm sóc con cái."}]}, {"title": "IV. CLOZE READING – FAMILY TIME", "passage": "Family time is when family members do things together. Ways of spending family time are different for different families, from taking a family (21) _________ in a nice place every year, or planning a family movie night every week, to having one meal together every day. Some families spend time together just by having regular family meetings. Family members can sit together to (22) _________ important issues and make decisions, or just have casual chats.\\n\\nSome people may think it is (23) _________ for everyone in the family to get together. However, in many cases, parents as well as children have to adjust their own timetables to make (24) _________ to be with their family. Family time is important as it helps make the bonds between family members (25) _________ and creates fond memories of happy experiences.", "translation": "Thời gian dành cho gia đình là lúc các thành viên trong gia đình cùng nhau làm mọi việc. Cách dành thời gian cho gia đình khác nhau ở mỗi gia đình, từ việc đi nghỉ cùng gia đình ở một nơi đẹp mỗi năm, lên kế hoạch cho một buổi tối xem phim gia đình mỗi tuần, cho đến cùng nhau ăn một bữa mỗi ngày. Một số gia đình dành thời gian bên nhau bằng cách tổ chức những buổi họp mặt gia đình thường xuyên. Các thành viên có thể ngồi lại để thảo luận những vấn đề quan trọng và đưa ra quyết định, hoặc chỉ trò chuyện thông thường.\\n\\nMột số người có thể nghĩ rằng mọi người trong gia đình rất dễ tụ họp cùng nhau. Tuy nhiên, trong nhiều trường hợp, cả cha mẹ và con cái đều phải điều chỉnh thời gian biểu của mình để dành thời gian ở bên gia đình. Thời gian dành cho gia đình rất quan trọng vì nó giúp mối quan hệ giữa các thành viên trở nên bền chặt hơn và tạo ra những kỷ niệm đẹp về những trải nghiệm hạnh phúc.", "questions": [{"n": 21, "q": "Choose the best word for blank (21).", "opts": ["course", "holiday", "photo", "responsibility"], "a": 1, "why": "Cụm từ đúng là “take a family holiday” = đi nghỉ cùng gia đình. Các từ còn lại không phù hợp với cấu trúc và ngữ cảnh.", "vi": "Mỗi gia đình có cách dành thời gian khác nhau, từ việc đi nghỉ cùng gia đình ở một nơi đẹp mỗi năm..."}, {"n": 22, "q": "Choose the best word for blank (22).", "opts": ["discuss", "argue", "laugh at", "enjoy"], "a": 0, "why": "“Discuss important issues” nghĩa là thảo luận những vấn đề quan trọng. “Discuss” không đi với giới từ “about”.", "vi": "Các thành viên trong gia đình có thể ngồi lại để thảo luận những vấn đề quan trọng và đưa ra quyết định."}, {"n": 23, "q": "Choose the best word for blank (23).", "opts": ["easy", "interesting", "hard", "funny"], "a": 0, "why": "Đáp án theo lời giải là “easy”. Cụm “it is easy for everyone in the family to get together” có nghĩa là mọi người trong gia đình dễ dàng tụ họp.", "vi": "Một số người có thể nghĩ rằng mọi người trong gia đình dễ dàng tụ họp cùng nhau."}, {"n": 24, "q": "Choose the best word for blank (24).", "opts": ["excuses", "friends", "time", "money"], "a": 2, "why": "Cụm từ “make time to do something” có nghĩa là sắp xếp/dành thời gian để làm việc gì.", "vi": "Cha mẹ cũng như con cái phải điều chỉnh thời gian biểu để dành thời gian ở bên gia đình."}, {"n": 25, "q": "Choose the best word for blank (25).", "opts": ["special", "stronger", "weaker", "natural"], "a": 1, "why": "“Make the bonds ... stronger” nghĩa là làm cho sự gắn kết trở nên bền chặt hơn.", "vi": "Thời gian dành cho gia đình giúp mối quan hệ giữa các thành viên trở nên bền chặt hơn."}]}, {"title": "V. READING – AMERICAN FAMILY DAY", "passage": "In 1977 Governor Raul Castro signed a paper suggesting that August 7, 1977 was American Family Day. One year later, Governor Bruce Babbitt signed the day into law as an official Arizona holiday. American Family Day is now celebrated across the United States on the first Sunday in August. It encourages people to enjoy the warming summer days with those dearest to them. Principally, the day encourages families to spend time with one another.\\n\\nUnlike some other family holidays, people do not give gifts on this day. Instead, they celebrate the day by focusing on family relationships. People believe that the best gift one can give their families is themselves. So on this day, people enjoy being with their families. The most common activities family members often do together include playing games outdoors or going for a walk in the park, watching a movie, visiting grandparents and bringing them a picnic lunch.\\n\\nSome families enjoy taking an art class together, visiting a museum or trying out a new recipe and getting the whole family involved in the cooking.\\n\\nWhatever people do, the most important thing should be that they do it with their families. Americans love their Family Day because it reminds them to express their love to their family and helps strengthen their family bonds.", "translation": "Năm 1977, Thống đốc Raul Castro ký một văn bản đề xuất ngày 7 tháng 8 năm 1977 là Ngày Gia đình Hoa Kỳ. Một năm sau, Thống đốc Bruce Babbitt ký ban hành ngày này thành một ngày lễ chính thức của bang Arizona. Ngày Gia đình Hoa Kỳ hiện được tổ chức trên khắp Hoa Kỳ vào Chủ nhật đầu tiên của tháng Tám. Ngày này khuyến khích mọi người tận hưởng những ngày hè ấm áp bên những người thân yêu nhất. Về cơ bản, ngày này khuyến khích các gia đình dành thời gian cho nhau.\\n\\nKhông giống một số ngày lễ gia đình khác, mọi người không tặng quà vào ngày này. Thay vào đó, họ kỷ niệm ngày này bằng cách tập trung vào các mối quan hệ gia đình. Mọi người tin rằng món quà tuyệt vời nhất có thể dành tặng gia đình chính là bản thân mình. Vì vậy, vào ngày này, mọi người thích ở bên gia đình. Những hoạt động phổ biến nhất mà các thành viên thường làm cùng nhau bao gồm chơi trò chơi ngoài trời hoặc đi dạo trong công viên, xem phim, thăm ông bà và mang bữa trưa dã ngoại đến cho ông bà.\\n\\nMột số gia đình thích cùng nhau tham gia lớp học nghệ thuật, thăm viện bảo tàng hoặc thử một công thức nấu ăn mới và để cả gia đình cùng tham gia nấu nướng.\\n\\nDù mọi người làm gì, điều quan trọng nhất là họ làm điều đó cùng gia đình. Người Mỹ yêu thích Ngày Gia đình vì ngày này nhắc nhở họ thể hiện tình yêu thương với gia đình và giúp thắt chặt tình cảm gia đình.", "questions": [{"n": 26, "q": "American Family Day is usually on Sunday.", "opts": ["True", "False"], "a": 0, "why": "Bài đọc nêu rõ ngày này được tổ chức vào Chủ nhật đầu tiên của tháng Tám.", "vi": "Ngày Gia đình Hoa Kỳ thường diễn ra vào Chủ nhật."}, {"n": 27, "q": "People often give gifts to their family members on American Family Day.", "opts": ["True", "False"], "a": 1, "why": "Bài đọc nói rõ: “people do not give gifts on this day” – mọi người không tặng quà vào ngày này.", "vi": "Mọi người thường tặng quà cho các thành viên trong gia đình vào Ngày Gia đình Hoa Kỳ."}, {"n": 28, "q": "On Family Day, family members often visit their friends together.", "opts": ["True", "False"], "a": 1, "why": "Bài đọc đề cập các gia đình chơi trò chơi ngoài trời, đi dạo, xem phim, thăm ông bà, đi bảo tàng... chứ không nói họ đi thăm bạn bè.", "vi": "Vào Ngày Gia đình, các thành viên thường cùng nhau đi thăm bạn bè."}, {"n": 29, "q": "Some families celebrate Family Day by cooking together.", "opts": ["True", "False"], "a": 0, "why": "Bài đọc nói một số gia đình thử công thức nấu ăn mới và để cả gia đình cùng tham gia nấu nướng.", "vi": "Một số gia đình kỷ niệm Ngày Gia đình bằng cách cùng nhau nấu ăn."}, {"n": 30, "q": "Family Day is the chance for people to express their love to their family.", "opts": ["True", "False"], "a": 0, "why": "Câu cuối nêu rằng Ngày Gia đình nhắc nhở người Mỹ thể hiện tình yêu thương với gia đình và củng cố sự gắn kết.", "vi": "Ngày Gia đình là cơ hội để mọi người thể hiện tình yêu thương với gia đình."}]}, {"title": "VI. SENTENCE TRANSFORMATION", "questions": [{"n": 31, "q": "I enjoyed myself at your birthday party. (fun)", "prefix": "I ", "suffix": ".", "answer": "had fun at your birthday party", "full": "I had fun at your birthday party.", "why": "“Enjoy oneself” có nghĩa là tận hưởng/vui vẻ. Cụm tương đương là “have fun”. Vì câu ở quá khứ nên dùng “had fun”.", "vi": "Tôi đã rất vui tại bữa tiệc sinh nhật của bạn."}, {"n": 32, "q": "My laptop crashes. I'll call you. (when)", "prefix": "I'll ", "suffix": ".", "answer": "call you when my laptop crashes", "full": "I'll call you when my laptop crashes.", "why": "Khi nói về tương lai với mệnh đề thời gian bắt đầu bằng “when”, mệnh đề chính dùng will + V, còn mệnh đề when dùng hiện tại đơn.", "vi": "Tôi sẽ gọi cho bạn khi máy tính xách tay của tôi bị hỏng."}, {"n": 33, "q": "My brother really likes football and never misses a match. (crazy)", "prefix": "My brother ", "suffix": ".", "answer": "is crazy about football and never misses a match", "full": "My brother is crazy about football and never misses a match.", "why": "“Like something very much” có thể diễn đạt bằng “be crazy about something”. Chủ ngữ “My brother” là số ít nên dùng “is”.", "vi": "Anh trai tôi rất mê bóng đá và không bao giờ bỏ lỡ một trận đấu."}, {"n": 34, "q": "I am not interested in what you are thinking. (care)", "prefix": "I ", "suffix": ".", "answer": "don't care about what you are thinking", "full": "I don't care about what you are thinking.", "why": "“Be interested in” có nghĩa là quan tâm đến; cấu trúc tương đương phủ định là “don't care about”.", "vi": "Tôi không quan tâm đến những gì bạn đang nghĩ."}, {"n": 35, "q": "Young children love watching animated films. (popular)", "prefix": "Animated films ", "suffix": ".", "answer": "are popular among young children", "full": "Animated films are popular among young children.", "why": "Chuyển “young children love watching animated films” thành “animated films are popular among young children”. Chủ ngữ số nhiều “Animated films” đi với “are”.", "vi": "Phim hoạt hình rất được trẻ nhỏ yêu thích."}, {"n": 36, "q": "I wasn't allowed to attend the live concert because I didn't finish the homework in time. (let)", "prefix": "My parents didn't ", "suffix": " the live concert because I didn't finish the homework in time.", "answer": "let me attend", "full": "My parents didn't let me attend the live concert because I didn't finish the homework in time.", "why": "“Be not allowed to do something” tương đương “not let somebody do something”. Sau “let + object” dùng động từ nguyên mẫu không “to”.", "vi": "Bố mẹ không cho tôi tham dự buổi hòa nhạc trực tiếp vì tôi không hoàn thành bài tập về nhà đúng hạn."}, {"n": 37, "q": "Humans affect the environment in many ways: overpopulation, pollution, burning fossil fuels, and deforestation. (by)", "prefix": "The environment ", "suffix": " humans in many ways: overpopulation, pollution, burning fossil fuels, and deforestation.", "answer": "is affected by", "full": "The environment is affected by humans in many ways: overpopulation, pollution, burning fossil fuels, and deforestation.", "why": "Chuyển câu chủ động sang bị động ở thì hiện tại đơn: S + am/is/are + V3/ed + by + O. “The environment” số ít nên dùng “is affected by”.", "vi": "Môi trường bị con người tác động theo nhiều cách: quá tải dân số, ô nhiễm, đốt nhiên liệu hóa thạch và phá rừng."}, {"n": 38, "q": "We are going to dance in our school's music festival this month. (plan)", "prefix": "We ", "suffix": " in our school's music festival this month.", "answer": "plan to dance", "full": "We plan to dance in our school's music festival this month.", "why": "“Be going to + V” diễn tả dự định; có thể viết lại bằng “plan + to V”.", "vi": "Chúng tôi dự định biểu diễn/dance trong lễ hội âm nhạc của trường vào tháng này."}, {"n": 39, "q": "You mustn't bring pets into this cafeteria. (allowed)", "prefix": "You ", "suffix": " bring pets into this cafeteria.", "answer": "aren't allowed to", "full": "You aren't allowed to bring pets into this cafeteria.", "why": "“Mustn't + V” diễn tả sự cấm đoán; cấu trúc tương đương là “be not allowed to + V”.", "vi": "Bạn không được phép mang thú cưng vào căng tin này."}, {"n": 40, "q": "I'm going to pay someone to refurbish the room. (refurbished)", "prefix": "I'm going to ", "suffix": ".", "answer": "have the room refurbished", "full": "I'm going to have the room refurbished.", "why": "Cấu trúc sai khiến: have + object + past participle (V3/ed) = thuê/nhờ ai làm việc gì cho mình. “Have the room refurbished” nghĩa là thuê người sửa sang căn phòng.", "vi": "Tôi sẽ thuê người sửa sang lại căn phòng."}]}];
let si=0,qi=0,states=sections.map(s=>s.questions.map(()=>({done:false,choice:null,value:''})));
function unlock(){if(document.getElementById('pw').value==='367'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}else document.getElementById('err').textContent='Sai mật khẩu. Vui lòng thử lại.'}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function scoreSection(i){return states[i].filter((x,j)=>x.done&&x.choice===sections[i].questions[j].a || x.done&&sections[i].questions[j].answer&&norm(x.value)===norm(sections[i].questions[j].answer)).length}
function doneSection(i){return states[i].filter(x=>x.done).length}
function totalScore(){return sections.reduce((n,s,i)=>n+scoreSection(i),0)}
function totalDone(){return sections.reduce((n,s,i)=>n+doneSection(i),0)}
function tabs(){document.getElementById('tabs').innerHTML=sections.map((s,i)=>`<button class="${i===si?'active':''}" onclick="si=${i};qi=0;render()">${s.title}</button>`).join('')}
function render(){
 const s=sections[si],q=s.questions[qi],st=states[si][qi];
 document.getElementById('sectionName').textContent=s.title;document.getElementById('overallScore').textContent=`Tổng điểm: ${totalScore()}/${totalDone()} câu đã làm`;
 document.getElementById('counter').textContent=`Câu ${qi+1}/${s.questions.length} · Đã làm: ${doneSection(si)}/${s.questions.length}`;
 document.getElementById('score').textContent=`Điểm phần: ${scoreSection(si)}/${doneSection(si)}`;document.getElementById('bar').style.width=((qi+1)/s.questions.length*100)+'%';tabs();
 document.getElementById('jump').innerHTML=s.questions.map((x,i)=>`<button class="${i===qi?'current ':''}${states[si][i].done?'done':''}" onclick="qi=${i};render()">${x.n}</button>`).join('');
 let qhtml='';
 if(q.opts){qhtml=`<div class="qnum">QUESTION ${q.n}</div><div class="question">${esc(q.q)}</div><div class="options">`;q.opts.forEach((o,j)=>{let c='option';if(st.done&&j===q.a)c+=' correct';else if(st.done&&j===st.choice&&j!==q.a)c+=' wrong';qhtml+=`<button class="${c}" ${st.done?'disabled':''} onclick="choose(${j})">${String.fromCharCode(65+j)}. ${esc(o)}</button>`});qhtml+='</div>'}
 else {qhtml=`<div class="qnum">QUESTION ${q.n}</div><div class="question">${esc(q.q)}</div><div class="input-wrap"><div><b>Complete the sentence:</b></div><div style="margin:8px 0">${esc(q.prefix||'')}<input class="answer-input" id="typed" value="${esc(st.value)}" placeholder="Type your answer here..." ${st.done?'disabled':''}>${esc(q.suffix||'')}</div><div class="input-nav"><button class="primary" onclick="checkTyped()" ${st.done?'disabled':''}>CHECK</button></div></div>`}
 if(st.done){let ok=q.opts?st.choice===q.a:norm(st.value)===norm(q.answer);qhtml+=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ Correct!':'✗ Chưa chính xác. Đáp án: '+esc(q.opts?String.fromCharCode(65+q.a)+'. '+q.opts[q.a]:q.full)}</b><div><strong>Giải thích:</strong> ${esc(q.why||'')}</div><div style="margin-top:7px"><strong>Dịch nghĩa:</strong> ${esc(q.vi||'')}</div></div>`}
 qhtml+=`<div class="nav"><button class="soft" onclick="move(-1)" ${qi===0?'disabled':''}>← PREVIOUS</button><button class="primary" onclick="move(1)" ${qi===s.questions.length-1?'disabled':''}>NEXT →</button></div>`;
 let out=qhtml;
 if(s.passage){out=`<div class="reading-layout"><section class="reading-pane"><div class="pane-heading">${esc(s.passageTitle||"📖 READING PASSAGE")}</div><div class="passage">${esc(s.passage)}</div><details class="translation-toggle"><summary>🇻🇳 Xem bản dịch tiếng Việt (nhấn để mở)</summary><div class="translation">${esc(s.translation)}</div></details></section><section class="questions-pane"><div class="pane-heading">✍️ QUESTIONS</div>${qhtml}</section></div>`}

function choose(j){let st=states[si][qi];if(st.done)return;st.done=true;st.choice=j;render()}
function checkTyped(){let st=states[si][qi],el=document.getElementById('typed');if(st.done||!el||!el.value.trim())return;st.value=el.value.trim();st.done=true;render()}
function move(d){qi=Math.max(0,Math.min(sections[si].questions.length-1,qi+d));render()}
function resetCurrent(){states[si][qi]={done:false,choice:null,value:''};render()}
function resetSection(){if(confirm('Bạn muốn đặt lại toàn bộ câu hỏi trong phần này?')){states[si]=sections[si].questions.map(()=>({done:false,choice:null,value:''}));qi=0;render()}}
function norm(x){return String(x||'').toLowerCase().replace(/[’']/g,"'").replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim()}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['c','x','a','u','s'].includes(e.key.toLowerCase()))e.preventDefault()});
